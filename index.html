<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Merhaba, ben Zeynep</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 16px;
      font-family: "Segoe UI", Arial, sans-serif;
      background: linear-gradient(135deg, #ff9a9e, #fad0c4, #a1c4fd, #c2e9fb);
      background-size: 400% 400%;
      animation: arkaPlan 12s ease infinite;
    }

    @keyframes arkaPlan {
      0%   { background-position: 0% 50%; }
      50%  { background-position: 100% 50%; }
      100% { background-position: 0% 50%; }
    }

    .kart {
      background: rgba(255, 255, 255, 0.85);
      border-radius: 24px;
      padding: 48px 40px;
      text-align: center;
      box-shadow: 0 12px 40px rgba(0, 0, 0, 0.15);
      max-width: 520px;
      width: 100%;
    }

    .selam {
      font-size: 1.4rem;
      color: #555;
      margin-bottom: 12px;
    }

    h1 {
      font-size: clamp(2.2rem, 8vw, 3.5rem);
      background: linear-gradient(90deg, #ff512f, #dd2476, #6a11cb, #2575fc);
      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;
    }

    .emojiler {
      font-size: 2rem;
      margin-top: 20px;
      letter-spacing: 8px;
    }

    .sevgi {
      margin-top: 20px;
      font-size: 1.3rem;
      font-weight: bold;
      color: #dd2476;
    }

    .kalp {
      display: inline-block;
      animation: atis 1.2s ease-in-out infinite;
    }

    @keyframes atis {
      0%, 100% { transform: scale(1); }
      50%      { transform: scale(1.3); }
    }

    h2 {
      margin-top: 32px;
      font-size: 1.3rem;
      color: #6a11cb;
    }

    .hobiler {
      list-style: none;
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 10px;
      margin-top: 14px;
    }

    .hobiler li {
      padding: 8px 16px;
      border-radius: 999px;
      color: #fff;
      font-weight: 600;
    }

    .hobiler li:nth-child(1) { background: #ff512f; }
    .hobiler li:nth-child(2) { background: #dd2476; }
    .hobiler li:nth-child(3) { background: #6a11cb; }
    .hobiler li:nth-child(4) { background: #2575fc; }
  </style>
</head>
<body>
  <div class="kart">
    <p class="selam">Merhaba! 👋</p>
    <h1>Benim adım Zeynep</h1>
    <p class="sevgi">Ömer'i çok seviyorum <span class="kalp">❤️</span></p>

    <h2>Hobilerim</h2>
    <ul class="hobiler">
      <li>📚 Kitap okumak</li>
      <li>🎵 Müzik dinlemek</li>
      <li>✈️ Gezmek</li>
      <li>🍰 Tatlı yapmak</li>
    </ul>

    <p class="emojiler">🌸🌈✨</p>
  </div>
</body>
</html>
